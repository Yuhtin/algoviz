concepts:
  function-def:
    label: Definicao
    explanation: Recebe um grafo direcionado como lista de adjacencia.
  init-indegree:
    label: Calcular Grau de Entrada
    explanation: Conta quantas arestas chegam em cada vertice. Vertices com grau 0 nao tem dependencias.
  init-queue:
    label: Inicializar Fila
    explanation: Adiciona todos os vertices com grau de entrada 0 a fila - eles podem ser processados primeiro.
  main-loop:
    label: Loop Principal
    explanation: Processa vertices da fila enquanto houver vertices disponiveis.
  dequeue:
    label: Desenfileirar
    explanation: Remove o proximo vertice da fila e adiciona ao resultado.
  process-neighbors:
    label: Processar Vizinhos
    explanation: Para cada vizinho, decrementa seu grau de entrada pois uma dependencia foi satisfeita.
  check-zero:
    label: Verificar Grau Zero
    explanation: Se o grau de entrada do vizinho chegou a zero, ele pode ser processado.
  check-cycle:
    label: Verificar Ciclo
    explanation: Se o resultado tem menos vertices que o grafo, existe um ciclo.
  dfs-visit:
    label: Visitar DFS
    explanation: Visita o vertice recursivamente, processando todos os vizinhos primeiro.
  post-order:
    label: Pos-Ordem
    explanation: Adiciona o vertice ao resultado DEPOIS de processar todos os vizinhos.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      Topological Sort ordena vertices de um DAG (Directed Acyclic Graph) de forma que
      todas as dependencias aparecem antes dos vertices que dependem delas. E como
      ordenar tarefas onde algumas precisam ser feitas antes de outras.

      Existem duas abordagens classicas:

      **Algoritmo de Kahn (BFS):**
      Comeca pelos vertices sem dependencias (grau de entrada = 0) e vai removendo-os
      do grafo, atualizando os graus dos vizinhos. Quando um vizinho fica com grau 0,
      ele entra na fila.

      **DFS com pos-ordem:**
      Faz DFS normal, mas adiciona cada vertice ao resultado DEPOIS de visitar todos
      os vizinhos. No final, inverte o resultado.

      Ambos detectam ciclos: Kahn verifica se processou todos os vertices; DFS usa
      coloracao para detectar back edges.
    steps:
      - Calcule o grau de entrada de cada vertice
      - Adicione vertices com grau 0 a uma fila
      - Remova um vertice da fila e adicione ao resultado
      - Decremente o grau de entrada de todos os vizinhos
      - Se algum vizinho ficar com grau 0, adicione a fila
      - Repita ate a fila esvaziar
      - Se sobrar vertices, o grafo tem ciclo

  keyInsight: "Vertices sem dependencias (grau de entrada 0) podem ser processados imediatamente. Ao processa-los, liberamos seus dependentes."

  commonMistakes:
    - Nao verificar se o grafo tem ciclo (topological sort so existe para DAGs)
    - Esquecer de decrementar o grau de entrada dos vizinhos
    - Confundir com ordenacao comum de arrays
    - Assumir que existe apenas uma ordenacao valida (geralmente existem varias)

  bigO:
    time:
      notation: O(V + E)
      explanation: Cada vertice e processado uma vez, cada aresta e examinada uma vez.
      proof: Calculamos grau de entrada em O(E), processamos cada vertice uma vez e cada aresta uma vez ao atualizar graus.
    space:
      notation: O(V)
      explanation: Armazenamos graus de entrada e a fila, ambos O(V).
    bestCase:
      notation: O(V + E)
      explanation: Sempre precisamos examinar todo o grafo.
    worstCase:
      notation: O(V + E)
      explanation: Mesmo com ciclo, detectamos apos processar o grafo.

  comparisons:
    - name: Kahn (BFS)
      slug: topological-sort
      time: O(V + E)
      space: O(V)
      bestFor: Detectar ciclos facilmente, processar em paralelo
    - name: DFS pos-ordem
      slug: topological-sort
      time: O(V + E)
      space: O(V)
      bestFor: Implementacao simples se ja tem DFS

interview:
  - id: topsort-q1
    question: Explique topological sort e de um exemplo de aplicacao real.
    difficulty: easy
    companies: [Google, Amazon, Microsoft, Meta]
    tip: Pense em sistemas de build, curriculos de cursos, ou qualquer sistema com dependencias.
    rubric:
      - point: Define como ordenacao de DAG onde dependencias vem antes
        required: true
      - point: Da exemplo concreto (build system, cursos, tasks)
        required: true
      - point: Menciona que so funciona para DAGs
        required: true
      - point: Explica pelo menos um algoritmo (Kahn ou DFS)
        required: false
    idealAnswer: |
      Topological sort ordena vertices de um grafo direcionado aciclico (DAG) de forma
      que para toda aresta u->v, u aparece antes de v na ordenacao.

      Aplicacoes reais:
      - **Build systems (Make, Gradle)**: compilar dependencias antes do codigo principal
      - **Curriculo de cursos**: Calculo 1 antes de Calculo 2
      - **Package managers (npm, pip)**: instalar dependencias na ordem correta
      - **Spreadsheets**: calcular celulas na ordem certa quando ha formulas

      Dois algoritmos principais: Kahn (BFS com grau de entrada) e DFS com pos-ordem.
      Complexidade O(V + E). Se o grafo tem ciclo, topological sort nao existe.

  - id: topsort-q2
    question: Como detectar se um grafo direcionado tem ciclo usando topological sort?
    difficulty: medium
    companies: [Google, Amazon, Apple]
    tip: Pense no que acontece com o algoritmo de Kahn quando ha ciclo.
    followUp: Como encontrar os vertices que fazem parte do ciclo?
    rubric:
      - point: Explica que Kahn nao processa todos vertices se ha ciclo
        required: true
      - point: Vertices no ciclo nunca tem grau 0
        required: true
      - point: Alternativa com DFS usando tres cores
        required: false
      - point: Responde follow-up sobre encontrar vertices do ciclo
        required: false
    idealAnswer: |
      Com o algoritmo de Kahn, detectamos ciclo verificando se processamos todos os
      vertices. Se o resultado tem menos vertices que o grafo original, existe ciclo.

      Por que funciona: vertices em um ciclo nunca terao grau de entrada 0, pois sempre
      ha pelo menos uma aresta vindo de outro vertice do ciclo. Eles ficam "presos".

      ```python
      def has_cycle(graph):
          # ... algoritmo de Kahn ...
          return len(result) != len(graph)  # True se tem ciclo
      ```

      Para encontrar vertices do ciclo: os vertices NAO incluidos no resultado de Kahn
      sao exatamente os que participam de algum ciclo (ou dependem de um ciclo).

      Com DFS, use tres cores (branco/cinza/preto). Ciclo existe se encontrar vertice
      cinza durante a busca (back edge para ancestral na arvore DFS atual).

  - id: topsort-q3
    question: Implemente topological sort. Qual algoritmo voce escolheria e por que?
    difficulty: hard
    companies: [Google, Meta, Uber]
    tip: Kahn e melhor para paralelismo, DFS e mais simples se ja tem a estrutura.
    rubric:
      - point: Implementa corretamente um dos algoritmos
        required: true
      - point: Trata deteccao de ciclo
        required: true
      - point: Justifica escolha do algoritmo
        required: true
      - point: Menciona trade-offs entre Kahn e DFS
        required: false
    idealAnswer: |
      Escolho Kahn para a maioria dos casos por ser mais intuitivo e permitir
      paralelizacao (vertices com grau 0 podem ser processados simultaneamente).

      ```python
      from collections import deque

      def topological_sort(graph):
          # Calcular grau de entrada
          in_degree = {v: 0 for v in graph}
          for v in graph:
              for neighbor in graph[v]:
                  in_degree[neighbor] += 1

          # Vertices sem dependencias
          queue = deque([v for v in graph if in_degree[v] == 0])
          result = []

          while queue:
              v = queue.popleft()
              result.append(v)

              for neighbor in graph[v]:
                  in_degree[neighbor] -= 1
                  if in_degree[neighbor] == 0:
                      queue.append(neighbor)

          if len(result) != len(graph):
              return None  # Ciclo detectado

          return result
      ```

      Trade-offs:
      - **Kahn**: melhor para paralelismo, deteccao de ciclo natural, mais memoria
      - **DFS**: codigo mais curto se ja tem DFS, usa pilha de recursao
