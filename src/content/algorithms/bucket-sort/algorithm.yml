concepts:
  function-def:
    label: Definição
    explanation: Ordena um array de números entre 0 e 1.
  empty-check:
    label: Caso Base
    explanation: Verifica se o array está vazio para evitar divisão por zero.
  buckets-init:
    label: Inicialização
    explanation: Cria n buckets vazios, onde n é o tamanho do array.
  distribution:
    label: Distribuição
    explanation: Coloca cada elemento no bucket apropriado baseado no seu valor.
  bucket-sort:
    label: Ordenação
    explanation: Ordena cada bucket individualmente com o sort nativo.
  concatenation:
    label: Concatenação
    explanation: Junta todos os buckets em ordem para formar o resultado.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      Bucket Sort é um algoritmo de ordenação que não compara elementos diretamente.
      Em vez disso, distribui os elementos em "baldes" baseado nos seus valores,
      ordena cada balde, e concatena tudo.

      A magia acontece quando os elementos estão bem distribuídos. Se cada bucket
      tem poucos elementos, ordenar cada um é rápido. O resultado final é quase
      linear.

      O algoritmo brilha para números de ponto flutuante entre 0 e 1 com distribuição
      uniforme. Fora desse cenário, pode degradar para O(n²) se todos os elementos
      caírem no mesmo bucket.
    steps:
      - Cria n buckets vazios (n = tamanho do array)
      - Para cada elemento, calcula o bucket de destino (valor × n)
      - Coloca o elemento no bucket correspondente
      - Ordena cada bucket individualmente
      - Concatena os buckets em ordem

  keyInsight: Bucket Sort é O(n) quando os dados estão uniformemente distribuídos. É perfeito para floats entre 0 e 1.

  commonMistakes:
    - Assumir que sempre é O(n) — depende da distribuição
    - Usar poucos buckets, sobrecarregando alguns deles
    - Ignorar o custo do algoritmo de ordenação interno
    - Aplicar em dados não uniformes sem ajustar os buckets

  bigO:
    time:
      notation: O(n + k)
      explanation: n é o número de elementos, k é o número de buckets. Linear quando bem distribuído.
      proof: Distribuição O(n). Ordenação de cada bucket O(n/k × log(n/k)), totalizando O(n) quando uniforme. Concatenação O(k).
    space:
      notation: O(n + k)
      explanation: Precisa de espaço para os n elementos distribuídos em k buckets.
    bestCase:
      notation: O(n + k)
      explanation: Elementos uniformemente distribuídos entre os buckets.
    worstCase:
      notation: O(n²)
      explanation: Todos os elementos no mesmo bucket. Degrada para o sort interno.

  comparisons:
    - name: Bucket Sort
      slug: bucket-sort
      time: O(n+k)
      space: O(n+k)
      stable: true
      bestFor: Floats uniformemente distribuídos
    - name: Bubble Sort
      slug: bubble-sort
      time: O(n²)
      space: O(1)
      stable: true
      bestFor: Arrays pequenos
    - name: Counting Sort
      time: O(n+k)
      space: O(k)
      stable: true
      bestFor: Inteiros em faixa conhecida
    - name: Radix Sort
      time: O(d×n)
      space: O(n+k)
      stable: true
      bestFor: Inteiros com número fixo de dígitos

interview:
  - id: bucket-sort-q1
    question: Explique o Bucket Sort e quando você o usaria.
    difficulty: medium
    companies: [Google, Amazon, Microsoft]
    tip: Pense em como dividir o problema em partes menores.
    rubric:
      - point: Distribui elementos em buckets baseado no valor
        required: true
      - point: Ordena cada bucket individualmente
        required: true
      - point: Concatena os buckets para formar o resultado
        required: true
      - point: Funciona melhor com dados uniformemente distribuídos
        required: true
      - point: Complexidade O(n+k) no caso médio
        required: false
    idealAnswer: |
      Bucket Sort é um algoritmo distributivo:

      1. Cria buckets: divide o intervalo de valores em n buckets.

      2. Distribui elementos: cada elemento vai para o bucket apropriado.
         Para floats entre 0 e 1, índice = floor(valor × n).

      3. Ordena buckets: cada bucket é ordenado (geralmente com Insertion Sort).

      4. Concatena: junta os buckets em ordem.

      Quando usar:
      - Floats entre 0 e 1
      - Dados uniformemente distribuídos
      - Quando a distribuição permite poucos elementos por bucket

      Tempo: O(n+k) no caso médio. Espaço: O(n+k).

  - id: bucket-sort-q2
    question: Por que Bucket Sort pode ser O(n) no médio mas O(n²) no pior caso?
    difficulty: medium
    companies: [Meta, Apple]
    tip: O que acontece quando todos os elementos vão para o mesmo bucket?
    followUp: Como mitigar o pior caso?
    rubric:
      - point: Caso médio assume distribuição uniforme
        required: true
      - point: Pior caso — todos os elementos no mesmo bucket
        required: true
      - point: Ordenação interna domina a complexidade
        required: true
      - point: Sugere mitigações (mais buckets, sort interno O(n log n))
        required: false
    idealAnswer: |
      Por que O(n) no caso médio:
      - Com distribuição uniforme, cada bucket tem ~n/k elementos
      - Ordenar cada bucket com Insertion Sort: O((n/k)²)
      - Com k = n buckets, cada bucket tem ~1 elemento
      - Tempo total: O(n) para distribuir + O(k) para concatenar = O(n)

      Por que O(n²) no pior caso:
      - Todos os elementos no mesmo bucket (dados não uniformes)
      - Um bucket com n elementos precisa ser ordenado
      - Insertion Sort no pior caso: O(n²)
      - Exemplo: [0.11, 0.12, 0.13, 0.14, 0.15] com 5 buckets — todos no bucket 0

      Mitigações:
      1. Usar mais buckets se a distribuição for desconhecida
      2. Usar algoritmo O(n log n) para ordenar buckets
      3. Analisar a distribuição antes de escolher o algoritmo

  - id: bucket-sort-q3
    question: Compare Bucket Sort, Counting Sort e Radix Sort. Quando usar cada um?
    difficulty: hard
    companies: [Google, Microsoft, Uber]
    tip: Cada um funciona melhor para um tipo específico de dado.
    rubric:
      - point: Counting Sort — inteiros em faixa limitada
        required: true
      - point: Radix Sort — inteiros ou strings com dígitos/caracteres fixos
        required: true
      - point: Bucket Sort — floats uniformemente distribuídos
        required: true
      - point: Compara complexidades corretamente
        required: true
      - point: Menciona estabilidade
        required: false
    idealAnswer: |
      Comparação:

      Counting Sort:
      - Tipo: inteiros em faixa conhecida e pequena
      - Tempo: O(n + k), Espaço: O(k)
      - Quando: idades 0-150, notas 0-100
      - Precisa: k (range) não muito maior que n

      Radix Sort:
      - Tipo: inteiros com número fixo de dígitos, strings de tamanho fixo
      - Tempo: O(d × n), Espaço: O(n + k)
      - Quando: CPFs, telefones, datas
      - Precisa: d (dígitos) pequeno e constante

      Bucket Sort:
      - Tipo: floats entre 0 e 1
      - Tempo: O(n + k), Espaço: O(n + k)
      - Quando: dados uniformemente distribuídos
      - Pode adaptar para ranges arbitrários

      Todos são estáveis quando implementados corretamente.
