slug: bucket-sort
name: Bucket Sort
category: Ordenação
description: Algoritmo distributivo que divide elementos em buckets, ordena cada um, e concatena o resultado.
difficulty: Média
tags: [Ordenação, Distributivo, Linear]

complexity:
  time: O(n+k)
  space: O(n+k)

