concepts:
  function-def:
    label: Definição
    explanation: Recebe o grafo e o vértice inicial para começar a busca.
  init-visited:
    label: Conjunto Visitados
    explanation: Conjunto que rastreia quais vértices já foram visitados para evitar ciclos infinitos.
  base-case:
    label: Caso Base
    explanation: Se o vértice já foi visitado, retorna imediatamente para evitar loops.
  mark-visited:
    label: Marcar Visitado
    explanation: Marca o vértice atual como visitado antes de processar seus vizinhos.
  process-node:
    label: Processar Vértice
    explanation: "Executa a lógica desejada no vértice atual (ex: imprimir, adicionar à lista)."
  recurse:
    label: Recursão
    explanation: Chama DFS recursivamente para cada vizinho não visitado, indo mais fundo no grafo.
  stack-push:
    label: Empilhar
    explanation: Adiciona o vértice inicial na pilha para começar a busca iterativa.
  stack-pop:
    label: Desempilhar
    explanation: Remove o vértice do topo da pilha para processar.
  main-loop:
    label: Loop Principal
    explanation: Continua enquanto houver vértices na pilha para processar.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      DFS (Depth-First Search) explora um grafo indo o mais fundo possível em cada ramo
      antes de retroceder. Imagine explorar um labirinto: você segue um corredor até o fim,
      depois volta e tenta outro caminho.

      A ideia é simples: visite um vértice, marque como visitado, e recursivamente visite
      todos os vizinhos não visitados. Quando não houver mais vizinhos para explorar,
      retroceda (backtrack) para o vértice anterior.

      DFS pode ser implementado de duas formas:
      - Recursivo: usa a pilha de chamadas do sistema
      - Iterativo: usa uma pilha explícita

      A versão recursiva é mais elegante, mas pode causar stack overflow em grafos muito
      profundos. A versão iterativa é mais segura para grafos grandes.
    steps:
      - Comece pelo vértice inicial e marque como visitado
      - Para cada vizinho não visitado, vá recursivamente mais fundo
      - Quando todos os vizinhos forem visitados, retroceda
      - Continue até visitar todos os vértices alcançáveis

  keyInsight: DFS usa uma pilha (implícita na recursão ou explícita) para lembrar de onde veio, permitindo explorar profundamente e depois retroceder.

  commonMistakes:
    - Esquecer de marcar vértices como visitados (causa loop infinito em grafos com ciclos)
    - Confundir ordem de visitação com ordem de finalização
    - Não tratar grafos desconexos (DFS só visita vértices alcançáveis do início)
    - Usar recursão em grafos muito profundos sem considerar limite de pilha

  bigO:
    time:
      notation: O(V + E)
      explanation: Cada vértice é visitado uma vez, e cada aresta é examinada uma vez.
      proof: O conjunto visited garante que cada vértice entra no processamento apenas uma vez. Para cada vértice, iteramos sobre suas arestas adjacentes.
    space:
      notation: O(V)
      explanation: No pior caso, a pilha de recursão pode ter todos os vértices (grafo linear).
    bestCase:
      notation: O(V + E)
      explanation: Mesmo no melhor caso, precisamos verificar todas as arestas.
    worstCase:
      notation: O(V + E)
      explanation: Visitamos todos os vértices e examinamos todas as arestas.

  comparisons:
    - name: DFS
      slug: dfs
      time: O(V + E)
      space: O(V)
      bestFor: Detecção de ciclos, ordenação topológica, componentes conexos
    - name: BFS
      slug: bfs
      time: O(V + E)
      space: O(V)
      bestFor: Caminho mais curto em grafos sem peso, níveis de distância
    - name: Dijkstra
      slug: dijkstra
      time: O((V+E) log V)
      space: O(V)
      bestFor: Caminho mais curto com pesos positivos

interview:
  - id: dfs-q1
    question: Explique a diferença entre DFS e BFS. Quando usar cada um?
    difficulty: easy
    companies: [Google, Amazon, Microsoft, Meta]
    tip: Pense em termos de estrutura de dados (pilha vs fila) e tipo de problema.
    rubric:
      - point: Explica que DFS usa pilha e BFS usa fila
        required: true
      - point: DFS vai fundo primeiro, BFS explora nível por nível
        required: true
      - point: DFS para ciclos/topological sort, BFS para caminho mais curto sem peso
        required: true
      - point: Menciona complexidade igual O(V+E) para ambos
        required: false
    idealAnswer: |
      DFS (Depth-First Search) explora o grafo indo o mais fundo possível antes de retroceder,
      usando uma pilha (implícita na recursão ou explícita). BFS (Breadth-First Search) explora
      nível por nível, usando uma fila.

      Use DFS para:
      - Detectar ciclos em grafos
      - Ordenação topológica
      - Encontrar componentes fortemente conexos
      - Resolver labirintos (encontrar qualquer caminho)

      Use BFS para:
      - Caminho mais curto em grafos sem peso
      - Encontrar todos os vértices a distância k
      - Verificar se grafo é bipartido

      Ambos têm complexidade O(V + E), mas BFS usa mais memória em grafos largos,
      enquanto DFS pode ter problemas de stack overflow em grafos profundos.

  - id: dfs-q2
    question: Como detectar um ciclo em um grafo direcionado usando DFS?
    difficulty: medium
    companies: [Google, Amazon, Apple, Uber]
    tip: Pense em três estados para cada vértice, não apenas dois.
    followUp: E em um grafo não-direcionado?
    rubric:
      - point: Menciona usar três estados - não visitado, em processamento, finalizado
        required: true
      - point: Ciclo existe se encontrar vértice "em processamento" durante DFS
        required: true
      - point: Explica a diferença para grafos não-direcionados
        required: false
      - point: Menciona que grafo não-direcionado precisa ignorar aresta de volta ao pai
        required: false
    idealAnswer: |
      Para detectar ciclos em grafos direcionados, use três estados:
      - BRANCO (0): não visitado
      - CINZA (1): em processamento (na pilha de recursão atual)
      - PRETO (2): finalizado

      Durante o DFS, se encontrarmos um vértice CINZA, encontramos um ciclo (back edge).

      ```python
      def has_cycle(graph):
          color = {v: 0 for v in graph}  # 0=branco, 1=cinza, 2=preto

          def dfs(v):
              color[v] = 1  # cinza
              for neighbor in graph[v]:
                  if color[neighbor] == 1:  # ciclo!
                      return True
                  if color[neighbor] == 0 and dfs(neighbor):
                      return True
              color[v] = 2  # preto
              return False

          return any(dfs(v) for v in graph if color[v] == 0)
      ```

      Para grafos NÃO-direcionados, basta verificar se visitamos um vértice já visitado
      que não seja o pai direto. A aresta para o pai não conta como ciclo.

  - id: dfs-q3
    question: Implemente ordenação topológica usando DFS.
    difficulty: medium
    companies: [Google, Microsoft, LinkedIn, Uber]
    tip: Pense em quando adicionar o vértice ao resultado - antes ou depois de processar vizinhos?
    rubric:
      - point: Explica que ordenação topológica só funciona em DAGs
        required: true
      - point: Adiciona vértice ao resultado DEPOIS de processar todos os vizinhos
        required: true
      - point: Inverte o resultado no final (ou usa inserção no início)
        required: true
      - point: Menciona detecção de ciclo como pré-requisito
        required: false
    idealAnswer: |
      Ordenação topológica ordena vértices de um DAG tal que para toda aresta u->v,
      u aparece antes de v. Só funciona em grafos direcionados acíclicos (DAGs).

      A sacada é: adicione o vértice ao resultado DEPOIS de processar todos os vizinhos.
      Isso garante que dependências aparecem antes.

      ```python
      def topological_sort(graph):
          visited = set()
          result = []

          def dfs(v):
              visited.add(v)
              for neighbor in graph[v]:
                  if neighbor not in visited:
                      dfs(neighbor)
              result.append(v)  # adiciona DEPOIS dos vizinhos

          for v in graph:
              if v not in visited:
                  dfs(v)

          return result[::-1]  # inverte
      ```

      Complexidade: O(V + E). Na prática, combine com detecção de ciclo para
      validar que o grafo é realmente um DAG.
