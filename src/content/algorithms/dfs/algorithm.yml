slug: dfs
name: DFS (Depth-First Search)
category: Grafos
description: Algoritmo de busca em profundidade que explora o grafo indo o mais fundo possível antes de retroceder.
difficulty: Média
tags: [Grafo, Busca, Recursão, Stack]

complexity:
  time: O(V + E)
  space: O(V)

