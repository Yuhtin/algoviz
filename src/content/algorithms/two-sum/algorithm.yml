slug: two-sum
name: Two Sum
category: Arrays
description: Encontra dois números que somam ao valor alvo usando hash map para busca O(1).
difficulty: Fácil
tags: [Array, Hash Map, Complemento]

complexity:
  time: O(n)
  space: O(n)

presets:
  - label: Encontra (target=9)
    data: { array: [2, 7, 11, 15], target: 9 }
  - label: Encontra (target=6)
    data: { array: [3, 2, 4], target: 6 }
  - label: Não encontra
    data: { array: [1, 2, 3, 4], target: 100 }
  - label: Duplicados (target=6)
    data: { array: [3, 3], target: 6 }

concepts:
  function-def:
    label: Definição
    explanation: Recebe array e target, retorna os índices dos dois números que somam ao target.
  hash-map:
    label: Hash Map
    explanation: Dicionário que mapeia valor para índice. Permite busca em O(1).
  enumerate:
    label: Enumerate
    explanation: Itera pelo array retornando índice e valor ao mesmo tempo.
  complement:
    label: Complemento
    explanation: O número que precisamos encontrar — target menos o número atual.
  lookup:
    label: Busca
    explanation: Verifica se o complemento já foi visto. Hash map faz isso em O(1).
  store:
    label: Armazenar
    explanation: Adiciona o número atual ao hash map para buscas futuras.
  not-found:
    label: Não Encontrado
    explanation: Retorna None se não existe par que soma ao target.
  import:
    label: Import
    explanation: Importa HashMap da biblioteca padrão.
  pattern-match:
    label: Pattern Matching
    explanation: if let Some extrai o valor se existir. Elegante e type-safe.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      Two Sum é um clássico de entrevistas. O problema: dado um array e um valor alvo,
      encontre dois números que somam a esse valor.

      A solução ingênua usa dois loops — O(n²). Mas com um hash map, resolvemos em O(n).

      A sacada é perceber que, para cada número, sabemos exatamente qual outro número
      precisamos: o complemento (target - número atual). Em vez de procurar esse
      complemento com outro loop, guardamos os números já vistos em um hash map.
      Busca em hash map é O(1).
    steps:
      - Cria um hash map vazio
      - Para cada número, calcula o complemento (target - número)
      - Verifica se o complemento está no hash map
      - Se está, encontrou o par — retorna os índices
      - Se não está, adiciona o número atual ao hash map
      - Continua até encontrar ou terminar o array

  keyInsight: O hash map transforma busca O(n) em O(1). É a diferença entre O(n²) e O(n).

  commonMistakes:
    - Usar o mesmo elemento duas vezes (índices precisam ser diferentes)
    - Adicionar ao hash map antes de verificar (pode causar falso positivo)
    - Retornar valores em vez de índices
    - Esquecer que podem existir números negativos e zeros

  bigO:
    time:
      notation: O(n)
      explanation: Uma passada pelo array. Cada lookup no hash map é O(1).
      proof: n iterações × O(1) por iteração = O(n).
    space:
      notation: O(n)
      explanation: O hash map pode guardar até n elementos no pior caso.
    bestCase:
      notation: O(1)
      explanation: Se os dois primeiros elementos formam o par.
    worstCase:
      notation: O(n)
      explanation: O par está no final ou não existe.

  comparisons:
    - name: Two Sum (Hash Map)
      slug: two-sum
      time: O(n)
      space: O(n)
      bestFor: Array não ordenado
    - name: Two Sum (Dois Ponteiros)
      slug: two-sum-sorted
      time: O(n)
      space: O(1)
      bestFor: Array já ordenado
    - name: Two Sum (Força Bruta)
      slug: two-sum-brute
      time: O(n²)
      space: O(1)
      bestFor: Entender o problema
    - name: Three Sum
      slug: three-sum
      time: O(n²)
      space: O(1)
      bestFor: Encontrar triplas que somam zero

interview:
  - id: two-sum-q1
    question: Como resolver Two Sum de forma ótima? Por que usar hash map?
    difficulty: easy
    companies: [Google, Amazon, Meta, Microsoft, Apple]
    tip: O hash map transforma uma busca linear em busca constante.
    rubric:
      - point: Encontrar dois números que somam ao target
        required: true
      - point: Usar hash map para armazenar números já vistos
        required: true
      - point: Calcular complemento (target - número atual)
        required: true
      - point: Complexidade O(n) tempo e O(n) espaço
        required: true
      - point: Comparar com força bruta O(n²)
        required: false
    idealAnswer: |
      Two Sum pede dois números que somam a um valor alvo.

      Força bruta: dois loops aninhados, O(n²).

      Solução ótima com hash map:
      1. Para cada número, calcula o complemento (target - número)
      2. Verifica se o complemento está no hash map — O(1)
      3. Se sim, retorna os índices
      4. Se não, adiciona o número atual ao hash map

      O hash map muda a busca interna de O(n) para O(1).

      Tempo: O(n). Espaço: O(n) para o hash map.

  - id: two-sum-q2
    question: E se o array estiver ordenado? Dá para resolver com O(1) espaço?
    difficulty: medium
    companies: [Amazon, Microsoft, Bloomberg]
    tip: Dois ponteiros funcionam bem em arrays ordenados.
    followUp: E se precisar retornar todos os pares, não apenas um?
    rubric:
      - point: Técnica de dois ponteiros (início e fim)
        required: true
      - point: Quando mover cada ponteiro baseado na soma
        required: true
      - point: Complexidade O(n) tempo e O(1) espaço
        required: true
      - point: Array não ordenado precisaria ordenar primeiro — O(n log n)
        required: false
    idealAnswer: |
      Com array ordenado, dois ponteiros resolve em O(1) espaço:

      1. Ponteiro esquerdo no início (menor elemento)
      2. Ponteiro direito no fim (maior elemento)
      3. Calcula a soma
      4. Se soma == target: encontrou
      5. Se soma < target: move esquerdo para direita (aumenta soma)
      6. Se soma > target: move direito para esquerda (diminui soma)

      Tempo: O(n). Espaço: O(1).

      Se o array não está ordenado, pode ordenar primeiro em O(n log n).
      Dependendo do caso, hash map pode ser melhor.

      Para retornar todos os pares: continue movendo ponteiros após cada match,
      pulando duplicatas.

  - id: two-sum-q3
    question: Como estender para Three Sum? E para k-Sum?
    difficulty: hard
    companies: [Google, Meta, Uber, LinkedIn]
    tip: Three Sum se reduz a múltiplos Two Sum.
    followUp: Como evitar duplicatas no resultado?
    rubric:
      - point: Three Sum — fixar um elemento e aplicar Two Sum no resto
        required: true
      - point: Complexidade do Three Sum — O(n²)
        required: true
      - point: k-Sum generaliza — fixar k-2 elementos e aplicar Two Sum
        required: true
      - point: Para evitar duplicatas — pular elementos iguais consecutivos
        required: true
      - point: Ordenar primeiro facilita remover duplicatas
        required: false
    idealAnswer: |
      Three Sum (soma = 0):
      1. Ordena o array — O(n log n)
      2. Para cada elemento A[i], aplica Two Sum em A[i+1:] com target = -A[i]
      3. Usa dois ponteiros para o Two Sum interno
      4. Complexidade: O(n²)

      Evitar duplicatas:
      - Pula elementos iguais: if i > 0 and A[i] == A[i-1]: continue
      - Após encontrar um par, move ambos ponteiros e pula duplicatas

      k-Sum generalizado:
      - Caso base: k == 2 — Two Sum com dois ponteiros
      - Recursão: fixa um elemento, chama (k-1)-Sum no resto
      - Complexidade: O(n^(k-1))
