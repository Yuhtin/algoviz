slug: trie
name: Trie (Prefix Tree)
category: Strings
description: Arvore de prefixos para busca eficiente de strings, autocomplete e verificacao de prefixos em O(m) onde m e o tamanho da palavra.
difficulty: Difícil
tags: [Arvore, Strings, Prefixo, Autocomplete, Dicionario]

complexity:
  time: O(m)
  space: O(n * m)

