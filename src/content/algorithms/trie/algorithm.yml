concepts:
  class-def:
    label: Classe TrieNode
    explanation: Cada nó tem um mapa de filhos (caractere para nó) e um flag indicando fim de palavra.
  init-root:
    label: Inicializar Raiz
    explanation: Trie começa com um nó raiz vazio que representa o prefixo vazio.
  insert-op:
    label: Operação Insert
    explanation: Insere uma palavra caractere por caractere, criando nós conforme necessário.
  traverse:
    label: Travessia
    explanation: Percorre a trie seguindo os caracteres da palavra.
  create-node:
    label: Criar Nó
    explanation: Se o caractere não existe, cria um novo nó filho.
  mark-end:
    label: Marcar Fim
    explanation: Marca o último nó como fim de palavra válida.
  search-op:
    label: Operação Search
    explanation: Busca uma palavra exata - deve existir e estar marcada como fim.
  prefix-op:
    label: Operação StartsWith
    explanation: Verifica se existe alguma palavra com o prefixo dado.
  check-exists:
    label: Verificar Existência
    explanation: Verifica se o caractere existe nos filhos do nó atual.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      Trie (pronuncia-se "try") é uma árvore onde cada nó representa um caractere.
      O caminho da raiz até um nó forma um prefixo. Nós marcados como "fim de palavra"
      indicam palavras válidas no dicionário.

      Vantagens sobre hash table:
      - Busca de prefixos em O(m) - impossível com hash
      - Autocomplete natural - basta percorrer subárvore do prefixo
      - Sem colisões
      - Ordenação lexicográfica grátis (DFS da esquerda para direita)

      Estrutura do nó:
      - children: mapa de caractere para nó filho (dict ou array de 26)
      - is_end: boolean indicando se é fim de palavra válida

      A complexidade é sempre O(m) onde m é o tamanho da string, independente
      de quantas palavras existem na trie.
    steps:
      - Comece pela raiz (nó vazio)
      - Para cada caractere da palavra, vá para o filho correspondente
      - Se o filho não existe e estamos inserindo, crie-o
      - Ao final da inserção, marque o nó como fim de palavra
      - Para busca, verifique se chegou ao final E o nó está marcado

  keyInsight: Cada nó compartilha o prefixo de seus ancestrais. Palavras com prefixos comuns compartilham nós, economizando espaço e permitindo buscas por prefixo eficientes.

  commonMistakes:
    - Confundir search (palavra exata) com startsWith (prefixo)
    - Esquecer de marcar is_end na inserção
    - Não tratar caracteres que não existem na busca
    - Usar array fixo de 26 quando precisa de unicode

  bigO:
    time:
      notation: O(m)
      explanation: m é o tamanho da string. Cada operação percorre no máximo m nós.
      proof: Insert, search e startsWith visitam exatamente m nós, um por caractere.
    space:
      notation: O(n * m)
      explanation: No pior caso, n palavras de tamanho m sem prefixos comuns.
    bestCase:
      notation: O(m)
      explanation: Sempre O(m) independente do número de palavras.
    worstCase:
      notation: O(m)
      explanation: Mesmo no pior caso, só percorremos m nós.

  comparisons:
    - name: Trie
      slug: trie
      time: O(m) por operação
      space: O(n * m)
      bestFor: Autocomplete, busca por prefixo, dicionários
    - name: Hash Table
      time: O(m) médio
      space: O(n * m)
      bestFor: Busca exata de strings
    - name: BST de Strings
      time: O(m * log n)
      space: O(n * m)
      bestFor: Strings ordenadas, range queries

interview:
  - id: trie-q1
    question: Implemente uma Trie com insert, search e startsWith.
    difficulty: medium
    companies: [Google, Amazon, Microsoft, Meta]
    tip: Use um dicionário para filhos e um boolean para marcar fim de palavra.
    rubric:
      - point: Implementa insert corretamente
        required: true
      - point: Implementa search verificando is_end
        required: true
      - point: Implementa startsWith sem verificar is_end
        required: true
      - point: Código limpo e eficiente
        required: false
    idealAnswer: |
      ```python
      class TrieNode:
          def __init__(self):
              self.children = {}
              self.is_end = False

      class Trie:
          def __init__(self):
              self.root = TrieNode()

          def insert(self, word):
              node = self.root
              for char in word:
                  if char not in node.children:
                      node.children[char] = TrieNode()
                  node = node.children[char]
              node.is_end = True

          def search(self, word):
              node = self._find_node(word)
              return node is not None and node.is_end

          def startsWith(self, prefix):
              return self._find_node(prefix) is not None

          def _find_node(self, s):
              node = self.root
              for char in s:
                  if char not in node.children:
                      return None
                  node = node.children[char]
              return node
      ```

  - id: trie-q2
    question: Como implementar autocomplete usando Trie?
    difficulty: medium
    companies: [Google, Amazon, Uber]
    tip: Encontre o nó do prefixo, depois faça DFS para coletar todas as palavras.
    followUp: Como retornar apenas as top-k sugestões mais frequentes?
    rubric:
      - point: Navega até o nó do prefixo
        required: true
      - point: Faz DFS/BFS para coletar palavras completas
        required: true
      - point: Reconstrói as palavras corretamente
        required: true
      - point: Responde follow-up sobre top-k com frequência
        required: false
    idealAnswer: |
      ```python
      def autocomplete(self, prefix):
          node = self._find_node(prefix)
          if not node:
              return []

          results = []
          self._dfs(node, prefix, results)
          return results

      def _dfs(self, node, current, results):
          if node.is_end:
              results.append(current)
          for char, child in node.children.items():
              self._dfs(child, current + char, results)
      ```

      Para top-k por frequência:
      1. Armazene contador de frequência em cada nó is_end
      2. Use min-heap de tamanho k durante DFS
      3. Ou pré-compute top-k em cada nó (space-time tradeoff)

  - id: trie-q3
    question: Projete um sistema de busca com suporte a wildcard (.) que casa com qualquer caractere.
    difficulty: hard
    companies: [Google, Meta, Apple]
    tip: Quando encontrar '.', explore TODOS os filhos recursivamente.
    rubric:
      - point: Implementa busca normal para caracteres regulares
        required: true
      - point: Para '.', explora todos os filhos recursivamente
        required: true
      - point: Usa backtracking corretamente
        required: true
      - point: Analisa complexidade do pior caso
        required: false
    idealAnswer: |
      ```python
      def search_with_wildcard(self, word):
          return self._search_helper(self.root, word, 0)

      def _search_helper(self, node, word, index):
          if index == len(word):
              return node.is_end

          char = word[index]

          if char == '.':
              # Tenta todos os filhos
              for child in node.children.values():
                  if self._search_helper(child, word, index + 1):
                      return True
              return False
          else:
              if char not in node.children:
                  return False
              return self._search_helper(
                  node.children[char], word, index + 1
              )
      ```

      Complexidade:
      - Sem wildcard: O(m)
      - Com wildcard: O(26^k * m) no pior caso, onde k é o número de '.'
      - Na prática, muito mais rápido devido à estrutura da trie
