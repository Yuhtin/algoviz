slug: trie
name: Trie (Prefix Tree)
category: Strings
description: Árvore de prefixos para busca eficiente de strings, autocomplete e verificação de prefixos em O(m) onde m é o tamanho da palavra.
difficulty: Difícil
tags: [Árvore, Strings, Prefixo, Autocomplete, Dicionário]

complexity:
