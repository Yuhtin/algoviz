slug: knapsack
name: 0/1 Knapsack
category: Programação Dinâmica
description: Dada uma lista de itens com peso e valor, e uma mochila com capacidade limitada, escolha quais itens levar para maximizar o valor total. Cada item só pode ser pego uma vez.
difficulty: Média
tags: [DP, 2D, Otimização, Mochila, Backtrack]

complexity:
  time: O(n × W)
  space: O(n × W)

