slug: dijkstra
name: Dijkstra
category: Grafos
description: Algoritmo que calcula a menor distância entre um vértice de origem e todos os outros em grafos com pesos positivos.
difficulty: Média
tags: [Grafo, Caminho Mínimo, Greedy, Priority Queue]

complexity:
  time: O((V + E) log V)
  space: O(V)

