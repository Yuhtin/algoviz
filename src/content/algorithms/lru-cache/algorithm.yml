slug: lru-cache
name: LRU Cache
category: Hash
description: Cache com política Least Recently Used - remove o item menos recentemente usado quando cheio. Operações get e put em O(1).
difficulty: Difícil
tags: [Cache, Hash Table, Linked List, Design]

