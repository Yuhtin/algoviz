concepts:
  class-def:
    label: Estrutura do Cache
    explanation: Combina hash table (acesso O(1)) com doubly linked list (ordenação de uso O(1)).
  node-def:
    label: Nó da Lista
    explanation: Cada nó tem key, value, e ponteiros prev/next para navegação bidirecional.
  init-cache:
    label: Inicialização
    explanation: Cria hash table vazia e lista com nós sentinela head/tail para simplificar operações.
  get-op:
    label: Operação Get
    explanation: Busca no hash, move para o início da lista (mais recente), retorna valor.
  put-op:
    label: Operação Put
    explanation: Se existe atualiza valor, senão insere novo. Move para início. Se excede capacidade, remove o último.
  move-to-front:
    label: Mover para Frente
    explanation: Remove o nó da posição atual e insere no início da lista.
  remove-node:
    label: Remover Nó
    explanation: Ajusta ponteiros prev/next para remover nó da lista em O(1).
  add-to-front:
    label: Adicionar na Frente
    explanation: Insere nó logo após head sentinela, tornando-o o mais recentemente usado.
  evict-lru:
    label: Remover LRU
    explanation: Remove o nó antes do tail sentinela - o menos recentemente usado.
  hash-lookup:
    label: Busca no Hash
    explanation: Hash table mapeia key diretamente para o nó na lista, permitindo acesso O(1).

theory:
  howItWorks:
    title: Como Funciona
    content: |
      LRU Cache é uma estrutura que combina duas ideias:

      Hash Table: para acesso O(1) por chave
      Doubly Linked List: para manter ordem de uso e remoção O(1)

      A lista mantém items ordenados por uso recente: mais recente na frente, menos
      recente no final. O hash mapeia chaves diretamente para nós da lista.

      Operações:
      - get(key): busca no hash, se existe move para frente e retorna valor
      - put(key, value): se existe atualiza e move para frente; senão cria nó,
        adiciona na frente, e se exceder capacidade remove o último (LRU)

      O truque dos nós sentinela (dummy head e tail) elimina casos especiais de
      lista vazia ou um elemento, simplificando muito o código.
    steps:
      - Hash table mapeia key para nó da lista
      - Lista duplamente encadeada mantém ordem de uso
      - Get move o nó acessado para o início
      - Put adiciona no início e remove do final se necessário
      - Sentinelas head/tail simplificam inserção/remoção

  keyInsight: A combinação de hash table + doubly linked list permite tanto acesso por chave quanto manutenção de ordem em O(1). Nenhuma estrutura sozinha consegue isso.

  commonMistakes:
    - Usar lista simples (remoção do meio seria O(n))
    - Esquecer de atualizar o hash ao remover do cache
    - Não mover para frente no get (só conta como "usado" se mover)
    - Esquecer de tratar atualização de valor existente

  bigO:
    time:
      notation: O(1)
      explanation: Todas operações são O(1) - hash lookup e manipulação de ponteiros.
      proof: Hash table dá acesso O(1) ao nó, lista duplamente encadeada permite remoção e inserção O(1).
    space:
      notation: O(capacity)
      explanation: Armazena no máximo capacity items no hash e na lista.
    bestCase:
      notation: O(1)
      explanation: Sempre O(1) independente do estado do cache.
    worstCase:
      notation: O(1)
      explanation: Mesmo com eviction, operações são O(1).

  comparisons:
    - name: LRU Cache
      slug: lru-cache
      time: O(1) get/put
      space: O(capacity)
      bestFor: Cache de acesso frequente, memória limitada
    - name: LFU Cache
      time: O(1) get/put
      space: O(capacity)
      bestFor: Quando frequência importa mais que recência
    - name: FIFO Cache
      time: O(1) get/put
      space: O(capacity)
      bestFor: Simplicidade, ordem de chegada

interview:
  - id: lru-q1
    question: Projete e implemente um LRU Cache com get e put em O(1).
    difficulty: hard
    companies: [Google, Amazon, Microsoft, Meta, Apple]
    tip: Pense em quais estruturas de dados permitem acesso e ordenação em O(1).
    rubric:
      - point: Identifica necessidade de hash table + linked list
        required: true
      - point: Usa doubly linked list (não singly)
        required: true
      - point: Implementa get movendo para frente
        required: true
      - point: Implementa put com eviction correta
        required: true
    idealAnswer: |
      ```python
      class Node:
          def __init__(self, key=0, val=0):
              self.key, self.val = key, val
              self.prev = self.next = None

      class LRUCache:
          def __init__(self, capacity):
              self.cap = capacity
              self.cache = {}  # key -> node
              self.head = Node()  # dummy head
              self.tail = Node()  # dummy tail
              self.head.next = self.tail
              self.tail.prev = self.head

          def _remove(self, node):
              node.prev.next = node.next
              node.next.prev = node.prev

          def _add_front(self, node):
              node.next = self.head.next
              node.prev = self.head
              self.head.next.prev = node
              self.head.next = node

          def get(self, key):
              if key not in self.cache:
                  return -1
              node = self.cache[key]
              self._remove(node)
              self._add_front(node)
              return node.val

          def put(self, key, value):
              if key in self.cache:
                  self._remove(self.cache[key])
              node = Node(key, value)
              self.cache[key] = node
              self._add_front(node)
              if len(self.cache) > self.cap:
                  lru = self.tail.prev
                  self._remove(lru)
                  del self.cache[lru.key]
      ```

  - id: lru-q2
    question: Por que usar doubly linked list em vez de singly linked list?
    difficulty: medium
    companies: [Google, Amazon]
    tip: Pense na complexidade de remover um nó do meio da lista.
    rubric:
      - point: Explica que remoção do meio requer acesso ao nó anterior
        required: true
      - point: Com singly list, encontrar anterior é O(n)
        required: true
      - point: Com doubly list, anterior é O(1) via prev pointer
        required: true
      - point: Menciona trade-off de memória extra
        required: false
    idealAnswer: |
      Para remover um nó do meio da lista em O(1), precisamos ajustar o ponteiro
      next do nó ANTERIOR. Com singly linked list, para encontrar o anterior
      precisaríamos percorrer desde o início - O(n).

      Com doubly linked list, cada nó tem ponteiro para o anterior (prev), então
      a remoção é O(1):

      ```python
      def remove(node):
          node.prev.next = node.next  # O(1)
          node.next.prev = node.prev  # O(1)
      ```

      O trade-off é memória extra para o ponteiro prev, mas em LRU Cache isso é
      essencial para manter todas operações O(1).

  - id: lru-q3
    question: Como você faria LRU Cache thread-safe?
    difficulty: hard
    companies: [Google, Meta, Uber]
    tip: Considere granularidade do lock e possibilidade de estruturas lock-free.
    followUp: Como minimizar contenção em sistema de alta concorrência?
    rubric:
      - point: Menciona necessidade de sincronização para get e put
        required: true
      - point: Sugere lock global (mutex) como solução simples
        required: true
      - point: Discute alternativas como read-write lock
        required: false
      - point: Menciona sharding ou estruturas concorrentes
        required: false
    idealAnswer: |
      Solução simples - mutex global:
      ```python
      import threading

      class ThreadSafeLRU:
          def __init__(self, capacity):
              self.cache = LRUCache(capacity)
              self.lock = threading.Lock()

          def get(self, key):
              with self.lock:
                  return self.cache.get(key)

          def put(self, key, value):
              with self.lock:
                  self.cache.put(key, value)
      ```

      Otimizações para alta concorrência:
      1. Read-write lock: permite múltiplos gets simultâneos
      2. Sharding: dividir em N caches menores por hash(key) % N
      3. Lock-free: usar CAS (compare-and-swap) para atualizações atômicas
      4. Aproximação: atualizar ordem de uso de forma probabilística

      Na prática, sharding é a abordagem mais comum em sistemas de produção
      (ex: Memcached, Redis cluster).
