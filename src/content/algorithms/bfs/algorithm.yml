concepts:
  function-def:
    label: Definicao
    explanation: Recebe o grafo e o vertice inicial para comecar a busca.
  init-visited:
    label: Conjunto Visitados
    explanation: Conjunto que rastreia quais vertices ja foram visitados para evitar processamento duplicado.
  init-queue:
    label: Inicializar Fila
    explanation: Cria a fila e adiciona o vertice inicial. A fila garante processamento em ordem de nivel.
  main-loop:
    label: Loop Principal
    explanation: Continua enquanto houver vertices na fila para processar.
  dequeue:
    label: Desenfileirar
    explanation: "Remove o proximo vertice da frente da fila (FIFO - primeiro a entrar, primeiro a sair)."
  process-node:
    label: Processar Vertice
    explanation: "Executa a logica desejada no vertice atual (ex: verificar se e o destino)."
  check-visited:
    label: Verificar Visitado
    explanation: Verifica se o vizinho ja foi visitado antes de adiciona-lo a fila.
  enqueue:
    label: Enfileirar
    explanation: Adiciona vizinhos nao visitados ao final da fila para processamento posterior.
  mark-visited:
    label: Marcar Visitado
    explanation: Marca o vizinho como visitado ao adiciona-lo a fila (importante para evitar duplicatas).
  track-distance:
    label: Rastrear Distancia
    explanation: Atualiza a distancia do vizinho como distancia atual + 1.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      BFS (Breadth-First Search) explora um grafo nivel por nivel, como ondas se espalhando
      em um lago. Primeiro visita todos os vizinhos diretos, depois os vizinhos dos vizinhos,
      e assim por diante.

      A chave do BFS e usar uma FILA (queue) em vez de pilha. A fila garante que vertices
      descobertos primeiro sejam processados primeiro (FIFO). Isso naturalmente resulta
      em exploracao por niveis de distancia.

      Por explorar nivel por nivel, BFS encontra automaticamente o caminho mais curto
      (em numero de arestas) entre dois vertices em grafos sem peso. Esse e o motivo
      pelo qual e usado em GPS para encontrar rotas e em jogos para pathfinding em grids.
    steps:
      - Adicione o vertice inicial a fila e marque como visitado
      - Remova o primeiro vertice da fila
      - Processe o vertice (verifique se e o destino, etc.)
      - Adicione todos os vizinhos nao visitados a fila
      - Repita ate a fila esvaziar ou encontrar o destino

  keyInsight: A fila FIFO garante que vertices mais proximos da origem sejam sempre processados antes dos mais distantes, resultando em exploracao por niveis e caminho minimo.

  commonMistakes:
    - Marcar como visitado ao REMOVER da fila (deve marcar ao ADICIONAR para evitar duplicatas)
    - Usar pilha em vez de fila (isso seria DFS)
    - Esquecer de tratar grafos desconexos
    - Nao armazenar predecessores quando precisa reconstruir o caminho

  bigO:
    time:
      notation: O(V + E)
      explanation: Cada vertice e enfileirado uma vez, e cada aresta e examinada uma vez.
      proof: O conjunto visited garante que cada vertice entra na fila apenas uma vez. Para cada vertice desenfileirado, iteramos sobre suas arestas adjacentes.
    space:
      notation: O(V)
      explanation: A fila pode conter ate todos os vertices no pior caso (grafo estrela).
    bestCase:
      notation: O(1)
      explanation: Se o destino e o proprio vertice inicial.
    worstCase:
      notation: O(V + E)
      explanation: Quando precisamos visitar todo o grafo.

  comparisons:
    - name: BFS
      slug: bfs
      time: O(V + E)
      space: O(V)
      bestFor: Caminho mais curto em grafos sem peso, niveis de distancia
    - name: DFS
      slug: dfs
      time: O(V + E)
      space: O(V)
      bestFor: Deteccao de ciclos, ordenacao topologica
    - name: Dijkstra
      slug: dijkstra
      time: O((V+E) log V)
      space: O(V)
      bestFor: Caminho mais curto com pesos positivos

interview:
  - id: bfs-q1
    question: Como usar BFS para encontrar o caminho mais curto entre dois vertices?
    difficulty: easy
    companies: [Google, Amazon, Microsoft, Meta]
    tip: Voce precisa armazenar mais do que apenas vertices visitados.
    rubric:
      - point: Explica que BFS encontra caminho mais curto em grafos sem peso
        required: true
      - point: Menciona usar array/dict de predecessores para reconstruir caminho
        required: true
      - point: Descreve como fazer backtrack do destino ate origem
        required: true
      - point: Menciona que pode armazenar distancias junto
        required: false
    idealAnswer: |
      BFS naturalmente encontra o caminho mais curto em grafos sem peso porque explora
      nivel por nivel. Para reconstruir o caminho:

      1. Mantenha um dicionario `predecessor` onde `predecessor[v] = u` significa
         que chegamos em `v` a partir de `u`
      2. Quando encontrar o destino, faca backtrack seguindo predecessores

      ```python
      def bfs_shortest_path(graph, start, end):
          if start == end:
              return [start]

          visited = {start}
          queue = deque([start])
          predecessor = {start: None}

          while queue:
              vertex = queue.popleft()

              for neighbor in graph[vertex]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      predecessor[neighbor] = vertex
                      queue.append(neighbor)

                      if neighbor == end:
                          # Reconstruir caminho
                          path = []
                          current = end
                          while current is not None:
                              path.append(current)
                              current = predecessor[current]
                          return path[::-1]

          return None  # Caminho nao existe
      ```

  - id: bfs-q2
    question: Como encontrar todos os vertices a exatamente k arestas de distancia de um vertice origem?
    difficulty: medium
    companies: [Google, LinkedIn, Uber]
    tip: Pense em como BFS processa vertices por nivel.
    followUp: E se voce precisasse de todos os vertices ate distancia k?
    rubric:
      - point: Usa BFS com rastreamento de nivel/distancia
        required: true
      - point: Para quando atinge nivel k+1
        required: true
      - point: Retorna apenas vertices do nivel k
        required: true
      - point: Menciona otimizacao de parar cedo
        required: false
    idealAnswer: |
      BFS processa vertices nivel por nivel, entao basta rastrear a distancia de cada
      vertice e coletar aqueles com distancia exata k:

      ```python
      def vertices_at_distance_k(graph, start, k):
          visited = {start}
          queue = deque([(start, 0)])  # (vertice, distancia)
          result = []

          while queue:
              vertex, dist = queue.popleft()

              if dist == k:
                  result.append(vertex)
                  continue  # Nao precisa expandir alem de k

              if dist > k:
                  break  # Otimizacao: ja passou de k

              for neighbor in graph[vertex]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      queue.append((neighbor, dist + 1))

          return result
      ```

      Para "ate distancia k", basta coletar todos com `dist <= k` em vez de `dist == k`.

  - id: bfs-q3
    question: Como verificar se um grafo e bipartido usando BFS?
    difficulty: medium
    companies: [Google, Amazon, Apple]
    tip: Pense em colorir vertices com duas cores alternadas.
    rubric:
      - point: Explica que grafo bipartido pode ser 2-colorido
        required: true
      - point: Usa BFS atribuindo cores alternadas a cada nivel
        required: true
      - point: Detecta conflito quando vizinho tem mesma cor
        required: true
      - point: Trata grafos desconexos (roda BFS de cada componente)
        required: false
    idealAnswer: |
      Um grafo e bipartido se seus vertices podem ser divididos em dois conjuntos onde
      toda aresta conecta vertices de conjuntos diferentes. Isso equivale a poder
      colorir o grafo com 2 cores sem vizinhos da mesma cor.

      ```python
      def is_bipartite(graph):
          color = {}

          for start in graph:  # Para grafos desconexos
              if start in color:
                  continue

              queue = deque([start])
              color[start] = 0

              while queue:
                  vertex = queue.popleft()

                  for neighbor in graph[vertex]:
                      if neighbor not in color:
                          # Colorir com cor oposta
                          color[neighbor] = 1 - color[vertex]
                          queue.append(neighbor)
                      elif color[neighbor] == color[vertex]:
                          # Conflito! Mesmo cor que vizinho
                          return False

          return True
      ```

      BFS naturalmente alterna entre niveis, entao vertices no mesmo nivel tem mesma
      cor, e niveis adjacentes tem cores diferentes.
