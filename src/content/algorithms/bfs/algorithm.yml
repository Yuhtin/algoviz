concepts:
  function-def:
    label: Definição
    explanation: Recebe o grafo e o vértice inicial para começar a busca.
  init-visited:
    label: Conjunto Visitados
    explanation: Conjunto que rastreia quais vértices já foram visitados para evitar processamento duplicado.
  init-queue:
    label: Inicializar Fila
    explanation: Cria a fila e adiciona o vértice inicial. A fila garante processamento em ordem de nível.
  main-loop:
    label: Loop Principal
    explanation: Continua enquanto houver vértices na fila para processar.
  dequeue:
    label: Desenfileirar
    explanation: "Remove o próximo vértice da frente da fila (FIFO - primeiro a entrar, primeiro a sair)."
  process-node:
    label: Processar Vértice
    explanation: "Executa a lógica desejada no vértice atual (ex: verificar se é o destino)."
  check-visited:
    label: Verificar Visitado
    explanation: Verifica se o vizinho já foi visitado antes de adicioná-lo à fila.
  enqueue:
    label: Enfileirar
    explanation: Adiciona vizinhos não visitados ao final da fila para processamento posterior.
  mark-visited:
    label: Marcar Visitado
    explanation: Marca o vizinho como visitado ao adicioná-lo à fila (importante para evitar duplicatas).
  track-distance:
    label: Rastrear Distância
    explanation: Atualiza a distância do vizinho como distância atual + 1.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      BFS (Breadth-First Search) explora um grafo nível por nível, como ondas se espalhando
      em um lago. Primeiro visita todos os vizinhos diretos, depois os vizinhos dos vizinhos,
      e assim por diante.

      A chave do BFS é usar uma FILA (queue) em vez de pilha. A fila garante que vértices
      descobertos primeiro sejam processados primeiro (FIFO). Isso naturalmente resulta
      em exploração por níveis de distância.

      Por explorar nível por nível, BFS encontra automaticamente o caminho mais curto
      (em número de arestas) entre dois vértices em grafos sem peso. Esse é o motivo
      pelo qual é usado em GPS para encontrar rotas e em jogos para pathfinding em grids.
    steps:
      - Adicione o vértice inicial à fila e marque como visitado
      - Remova o primeiro vértice da fila
      - Processe o vértice (verifique se é o destino, etc.)
      - Adicione todos os vizinhos não visitados à fila
      - Repita até a fila esvaziar ou encontrar o destino

  keyInsight: A fila FIFO garante que vértices mais próximos da origem sejam sempre processados antes dos mais distantes, resultando em exploração por níveis e caminho mínimo.

  commonMistakes:
    - Marcar como visitado ao REMOVER da fila (deve marcar ao ADICIONAR para evitar duplicatas)
    - Usar pilha em vez de fila (isso seria DFS)
    - Esquecer de tratar grafos desconexos
    - Não armazenar predecessores quando precisa reconstruir o caminho

  bigO:
    time:
      notation: O(V + E)
      explanation: Cada vértice é enfileirado uma vez, e cada aresta é examinada uma vez.
      proof: O conjunto visited garante que cada vértice entra na fila apenas uma vez. Para cada vértice desenfileirado, iteramos sobre suas arestas adjacentes.
    space:
      notation: O(V)
      explanation: A fila pode conter até todos os vértices no pior caso (grafo estrela).
    bestCase:
      notation: O(1)
      explanation: Se o destino é o próprio vértice inicial.
    worstCase:
      notation: O(V + E)
      explanation: Quando precisamos visitar todo o grafo.

  comparisons:
    - name: BFS
      slug: bfs
      time: O(V + E)
      space: O(V)
      bestFor: Caminho mais curto em grafos sem peso, níveis de distância
    - name: DFS
      slug: dfs
      time: O(V + E)
      space: O(V)
      bestFor: Detecção de ciclos, ordenação topológica
    - name: Dijkstra
      slug: dijkstra
      time: O((V+E) log V)
      space: O(V)
      bestFor: Caminho mais curto com pesos positivos

interview:
  - id: bfs-q1
    question: Como usar BFS para encontrar o caminho mais curto entre dois vértices?
    difficulty: easy
    companies: [Google, Amazon, Microsoft, Meta]
    tip: Você precisa armazenar mais do que apenas vértices visitados.
    rubric:
      - point: Explica que BFS encontra caminho mais curto em grafos sem peso
        required: true
      - point: Menciona usar array/dict de predecessores para reconstruir caminho
        required: true
      - point: Descreve como fazer backtrack do destino até origem
        required: true
      - point: Menciona que pode armazenar distâncias junto
        required: false
    idealAnswer: |
      BFS naturalmente encontra o caminho mais curto em grafos sem peso porque explora
      nível por nível. Para reconstruir o caminho:

      1. Mantenha um dicionário predecessor onde predecessor[v] = u significa
         que chegamos em v a partir de u
      2. Quando encontrar o destino, faça backtrack seguindo predecessores

      ```python
      def bfs_shortest_path(graph, start, end):
          if start == end:
              return [start]

          visited = {start}
          queue = deque([start])
          predecessor = {start: None}

          while queue:
              vertex = queue.popleft()

              for neighbor in graph[vertex]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      predecessor[neighbor] = vertex
                      queue.append(neighbor)

                      if neighbor == end:
                          # Reconstruir caminho
                          path = []
                          current = end
                          while current is not None:
                              path.append(current)
                              current = predecessor[current]
                          return path[::-1]

          return None  # Caminho não existe
      ```

  - id: bfs-q2
    question: Como encontrar todos os vértices a exatamente k arestas de distância de um vértice origem?
    difficulty: medium
    companies: [Google, LinkedIn, Uber]
    tip: Pense em como BFS processa vértices por nível.
    followUp: E se você precisasse de todos os vértices até distância k?
    rubric:
      - point: Usa BFS com rastreamento de nível/distância
        required: true
      - point: Para quando atinge nível k+1
        required: true
      - point: Retorna apenas vértices do nível k
        required: true
      - point: Menciona otimização de parar cedo
        required: false
    idealAnswer: |
      BFS processa vértices nível por nível, então basta rastrear a distância de cada
      vértice e coletar aqueles com distância exata k:

      ```python
      def vertices_at_distance_k(graph, start, k):
          visited = {start}
          queue = deque([(start, 0)])  # (vértice, distância)
          result = []

          while queue:
              vertex, dist = queue.popleft()

              if dist == k:
                  result.append(vertex)
                  continue  # Não precisa expandir além de k

              if dist > k:
                  break  # Otimização: já passou de k

              for neighbor in graph[vertex]:
                  if neighbor not in visited:
                      visited.add(neighbor)
                      queue.append((neighbor, dist + 1))

          return result
      ```

      Para "até distância k", basta coletar todos com dist <= k em vez de dist == k.

  - id: bfs-q3
    question: Como verificar se um grafo é bipartido usando BFS?
    difficulty: medium
    companies: [Google, Amazon, Apple]
    tip: Pense em colorir vértices com duas cores alternadas.
    rubric:
      - point: Explica que grafo bipartido pode ser 2-colorido
        required: true
      - point: Usa BFS atribuindo cores alternadas a cada nível
        required: true
      - point: Detecta conflito quando vizinho tem mesma cor
        required: true
      - point: Trata grafos desconexos (roda BFS de cada componente)
        required: false
    idealAnswer: |
      Um grafo é bipartido se seus vértices podem ser divididos em dois conjuntos onde
      toda aresta conecta vértices de conjuntos diferentes. Isso equivale a poder
      colorir o grafo com 2 cores sem vizinhos da mesma cor.

      ```python
      def is_bipartite(graph):
          color = {}

          for start in graph:  # Para grafos desconexos
              if start in color:
                  continue

              queue = deque([start])
              color[start] = 0

              while queue:
                  vertex = queue.popleft()

                  for neighbor in graph[vertex]:
                      if neighbor not in color:
                          # Colorir com cor oposta
                          color[neighbor] = 1 - color[vertex]
                          queue.append(neighbor)
                      elif color[neighbor] == color[vertex]:
                          # Conflito! Mesma cor que vizinho
                          return False

          return True
      ```

      BFS naturalmente alterna entre níveis, então vértices no mesmo nível têm mesma
      cor, e níveis adjacentes têm cores diferentes.
