slug: single-cycle-check
name: Ciclo Único em Array
category: Arrays
description: Verifica se é possível visitar todos os elementos exatamente uma vez e retornar ao início.
difficulty: Média
tags: [Array, Módulo, Ciclo]

complexity:
  time: O(n)
  space: O(1)

presets:
  - label: Ciclo Único (True)
    data: [2, 3, 1, -4, -4, 2]
  - label: Sem Ciclo (False)
    data: [1, 1, 1, 1, 2]
  - label: Negativos (True)
    data: [1, -1, 2, -2]
  - label: Grande (True)
    data: [2, 2, -1, 1, -3, -1]

concepts:
  function-def:
    label: Definição
    explanation: Recebe um array de inteiros e retorna True se forma um ciclo único.
  init:
    label: Inicialização
    explanation: Começa no índice 0 e conta quantos elementos visitou.
  main-loop:
    label: Loop Principal
    explanation: Executa exatamente n vezes para garantir que visita todos os elementos.
  direction-check:
    label: Verificação de Direção
    explanation: Todos os saltos devem ser na mesma direção (todos positivos ou todos negativos).
  next-index:
    label: Próximo Índice
    explanation: Calcula o próximo índice usando módulo para tratar o array como circular.
  increment:
    label: Incremento
    explanation: Conta mais um elemento visitado.
  return:
    label: Retorno
    explanation: Retorna True se visitou todos os elementos e terminou no índice 0.
  modulo-rust:
    label: Módulo em Rust
    explanation: Rust retorna resto com sinal. Usamos ((x % n) + n) % n para garantir positivo.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      Imagine um array onde cada elemento diz quantas posições pular. Valores positivos
      vão para a direita, negativos para a esquerda. O array é circular — se passar do
      final, volta ao início.

      A pergunta: começando no índice 0, consigo visitar todos os elementos exatamente
      uma vez e voltar ao índice 0?

      Parece complicado, mas a solução é direta. Siga os saltos, conte quantos elementos
      visitou, e verifique se terminou onde começou após n saltos.
    steps:
      - Começa no índice 0
      - Salta o número de posições indicado pelo elemento atual
      - Usa módulo para manter o índice dentro do array
      - Conta cada posição visitada
      - Repete até dar n saltos
      - Verifica se terminou no índice 0
      - Retorna true se visitou todos exatamente uma vez

  keyInsight: O truque é perceber que não precisa marcar posições visitadas. Se der n saltos e voltar ao 0, visitou todos.

  commonMistakes:
    - Esquecer de tratar módulo negativo (em linguagens que retornam resto negativo)
    - Não verificar se terminou no índice 0
    - Usar set para marcar visitados quando não precisa
    - Confundir detecção de ciclo com verificação de ciclo único

  bigO:
    time:
      notation: O(n)
      explanation: Faz exatamente n saltos, cada um em O(1).
      proof: n iterações × O(1) por iteração = O(n).
    space:
      notation: O(1)
      explanation: Só usa variáveis auxiliares. Sem estruturas extras.
    bestCase:
      notation: O(n)
      explanation: Sempre precisa verificar todos os elementos.
    worstCase:
      notation: O(n)
      explanation: A complexidade não muda com o input.

  comparisons:
    - name: Ciclo Único
      slug: single-cycle-check
      time: O(n)
      space: O(1)
      bestFor: Verificar ciclo hamiltoniano em array circular
    - name: Floyd Cycle Detection
      slug: floyd-cycle
      time: O(n)
      space: O(1)
      bestFor: Detectar ciclo em linked list
    - name: DFS para Ciclos
      slug: dfs-cycle
      time: O(V+E)
      space: O(V)
      bestFor: Detectar ciclo em grafos

interview:
  - id: single-cycle-q1
    question: O que é um "ciclo único" em um array e como verificar se existe?
    difficulty: easy
    companies: [Google, Meta, Amazon]
    tip: Pense no array como circular. O que significa visitar cada elemento uma vez?
    rubric:
      - point: Define ciclo único — visitar todos exatamente uma vez e voltar ao início
        required: true
      - point: Cada elemento indica quantas posições pular
        required: true
      - point: Array é circular (usa módulo)
        required: true
      - point: Complexidade O(n) tempo e O(1) espaço
        required: false
    idealAnswer: |
      Ciclo único significa que, começando do índice 0 e seguindo os saltos indicados
      por cada elemento, visitamos todos os elementos exatamente uma vez e voltamos
      ao índice 0.

      Cada elemento representa quantas posições pular: positivo vai para direita,
      negativo vai para esquerda. O array é circular — módulo mantém o índice válido.

      Algoritmo: conta elementos visitados e o índice atual. A cada iteração, salta
      para o próximo índice usando módulo. Se visitar n elementos e terminar no
      índice 0, é ciclo único.

      Tempo: O(n). Espaço: O(1).

  - id: single-cycle-q2
    question: Como tratar índices negativos ao calcular o próximo índice circular?
    difficulty: medium
    companies: [Microsoft, Apple, Uber]
    tip: O operador módulo se comporta diferente em linguagens diferentes.
    followUp: Qual a diferença entre Python e C++/Java/Rust?
    rubric:
      - point: Módulo pode retornar negativo em algumas linguagens
        required: true
      - point: Fórmula ((x % n) + n) % n garante resultado positivo
        required: true
      - point: Python já trata automaticamente
        required: false
      - point: Por que índices negativos acontecem (saltos negativos grandes)
        required: false
    idealAnswer: |
      O operador módulo se comporta diferente dependendo da linguagem.

      Em C++, Java e Rust: -7 % 5 = -2. Isso gera índice negativo inválido.

      Solução universal: ((x % n) + n) % n

      Exemplo: ((-7 % 5) + 5) % 5 = (-2 + 5) % 5 = 3

      Em Python, módulo já retorna positivo para divisor positivo: -7 % 5 = 3.

      Índices negativos acontecem com saltos negativos grandes. Por exemplo,
      saltar -10 posições a partir do índice 2 em um array de tamanho 5.

  - id: single-cycle-q3
    question: Qual a diferença entre detectar ciclo e verificar ciclo único (hamiltoniano)?
    difficulty: hard
    companies: [Google, Amazon, Bloomberg]
    tip: Um ciclo pode existir sem passar por todos os vértices.
    followUp: Dá para adaptar Floyd para este problema?
    rubric:
      - point: Detectar ciclo verifica se existe loop; ciclo único verifica se passa por todos
        required: true
      - point: Floyd detecta existência mas não garante unicidade
        required: true
      - point: Ciclo único requer contar elementos visitados
        required: true
      - point: Ambos O(n) tempo, mas ciclo único precisa verificar contagem
        required: false
      - point: Ciclo hamiltoniano em grafos gerais é NP-completo
        required: false
    idealAnswer: |
      São problemas diferentes:

      Detecção de ciclo: verifica se existe algum loop. Floyd (tartaruga e lebre)
      faz isso em O(n) tempo e O(1) espaço com dois ponteiros em velocidades
      diferentes.

      Ciclo único (hamiltoniano): verifica se o ciclo passa por TODOS os elementos
      exatamente uma vez. Precisa contar quantos elementos visitou.

      Exemplo: [2, 2, 2, 2] tem ciclo (volta ao início), mas não é ciclo único
      porque não visita todos os elementos.

      Para adaptar Floyd: não basta detectar que os ponteiros se encontram.
      Precisa verificar que encontraram após visitar exatamente n elementos
      e que terminaram no índice 0.

      Nota: em grafos gerais, ciclo hamiltoniano é NP-completo. Mas em arrays
      com saltos determinados (cada vértice tem uma aresta de saída), resolve
      em O(n).
