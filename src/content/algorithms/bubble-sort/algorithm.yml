slug: bubble-sort
name: Bubble Sort
category: Ordenação
description: Algoritmo de ordenação que compara elementos vizinhos e troca quando estão fora de ordem.
difficulty: Fácil
tags: [Ordenação, Comparação, In-place]

complexity:
  time: O(n²)
  space: O(1)

presets:
  - label: Desordenado
    data: [5, 3, 8, 4, 2]
  - label: Quase ordenado
    data: [1, 2, 4, 3, 5]
  - label: Invertido
    data: [5, 4, 3, 2, 1]
  - label: Já ordenado
    data: [1, 2, 3, 4, 5]

concepts:
  function-def:
    label: Definição
    explanation: Recebe um array e ordena in-place, retornando o mesmo array modificado.
  outer-loop:
    label: Loop Externo
    explanation: Roda n-1 vezes. A cada passada, o maior elemento vai para o final.
  optimization-flag:
    label: Otimização
    explanation: Flag que detecta quando nenhuma troca aconteceu — array já está ordenado.
  inner-loop:
    label: Loop Interno
    explanation: Compara pares vizinhos. O range diminui porque os últimos elementos já estão no lugar certo.
  comparison-swap:
    label: Comparação e Troca
    explanation: Se o elemento atual for maior que o próximo, troca os dois.
  early-exit:
    label: Saída Antecipada
    explanation: Se nenhuma troca aconteceu, o array está ordenado. Transforma o melhor caso em O(n).
  generic-function:
    label: Generics
    explanation: Função genérica que funciona com qualquer tipo comparável (Ord em Rust).
  swap-method:
    label: Método swap
    explanation: Rust tem swap nativo em slices. Mais seguro que manipular índices manualmente.

theory:
  howItWorks:
    title: Como Funciona
    content: |
      O Bubble Sort é provavelmente o primeiro algoritmo de ordenação que você aprende.
      A ideia é simples: percorra o array comparando vizinhos, e se estiverem fora de
      ordem, troque.

      O nome vem do comportamento dos elementos maiores, que "borbulham" para o final
      a cada passada. Depois de uma passada completa, o maior elemento está na última
      posição. Depois de duas, os dois maiores estão no lugar. E assim por diante.

      Na prática, ninguém usa Bubble Sort em produção. Merge Sort e Quick Sort são
      ordens de magnitude mais rápidos. Mas entender Bubble Sort ajuda a construir
      intuição sobre ordenação e complexidade.
    steps:
      - Começa no primeiro elemento
      - Compara com o vizinho da direita
      - Se estiver fora de ordem, troca
      - Avança para o próximo par
      - Repete até o final do array
      - O maior elemento agora está na última posição
      - Repete o processo, ignorando os elementos já ordenados

  keyInsight: O Bubble Sort é didático, mas lento. Use Merge Sort ou Quick Sort para qualquer coisa séria.

  commonMistakes:
    - Não reduzir o range do loop interno (os últimos elementos já estão ordenados)
    - Esquecer a otimização de early exit quando não há trocas
    - Confundir índices na hora da troca

  bigO:
    time:
      notation: O(n²)
      explanation: Dois loops aninhados. O externo roda n-1 vezes, o interno roda em média n/2.
      proof: "Comparações: (n-1) + (n-2) + ... + 1 = n(n-1)/2 = O(n²)"
    space:
      notation: O(1)
      explanation: Ordena in-place. Só usa variáveis auxiliares para a troca.
    bestCase:
      notation: O(n)
      explanation: Array já ordenado + flag de otimização = uma passada sem trocas.
    worstCase:
      notation: O(n²)
      explanation: Array em ordem reversa. Cada elemento precisa percorrer todo o array.

  comparisons:
    - name: Bubble Sort
      slug: bubble-sort
      time: O(n²)
      space: O(1)
      stable: true
      bestFor: Arrays pequenos, fins didáticos
    - name: Merge Sort
      slug: merge-sort
      time: O(n log n)
      space: O(n)
      stable: true
      bestFor: Grandes datasets, quando estabilidade importa
    - name: Quick Sort
      slug: quick-sort
      time: O(n log n)
      space: O(log n)
      stable: false
      bestFor: Uso geral, boa performance média
    - name: Insertion Sort
      slug: insertion-sort
      time: O(n²)
      space: O(1)
      stable: true
      bestFor: Arrays pequenos, dados chegando em streaming

interview:
  - id: bubble-sort-q1
    question: Explique o Bubble Sort e sua complexidade de tempo e espaço.
    difficulty: easy
    companies: [Google, Amazon, Microsoft]
    tip: Descreva o comportamento de "borbulhar" dos elementos maiores.
    rubric:
      - point: Compara elementos vizinhos e troca se estiverem fora de ordem
        required: true
      - point: Repete até não precisar de mais trocas
        required: true
      - point: Tempo O(n²) no pior/médio caso, O(n) no melhor com otimização
        required: true
      - point: Espaço O(1) — algoritmo in-place
        required: true
    idealAnswer: |
      O Bubble Sort compara pares de elementos vizinhos e troca quando estão fora de ordem.
      Cada passada "empurra" o maior elemento para o final, como uma bolha subindo.

      Repete o processo até uma passada completa sem trocas.

      Tempo: O(n²) no pior e médio caso. Com a flag de otimização, O(n) quando já ordenado.
      Espaço: O(1) — ordena in-place, só usa variáveis para a troca.
