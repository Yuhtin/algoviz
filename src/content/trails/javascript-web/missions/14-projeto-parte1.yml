content: |
  # Projeto Final - Parte 1

  Vamos construir uma aplicação completa de lista de tarefas usando tudo que aprendemos!

  ## O que vamos construir

  Uma to-do list com:
  - Adicionar tarefas
  - Marcar como concluída
  - Remover tarefas
  - Filtrar tarefas
  - Persistir dados no localStorage

  ## Estrutura HTML

  ```html
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>Minhas Tarefas</h1>

      <form id="form-tarefa">
        <input
          type="text"
          id="input-tarefa"
          placeholder="Adicionar nova tarefa"
          required
        >
        <button type="submit">Adicionar</button>
      </form>

      <div class="filtros">
        <button class="filtro ativo" data-filtro="todas">Todas</button>
        <button class="filtro" data-filtro="ativas">Ativas</button>
        <button class="filtro" data-filtro="concluidas">Concluídas</button>
      </div>

      <ul id="lista-tarefas"></ul>

      <div class="stats">
        <span id="total">0 tarefas</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
  </html>
  ```

